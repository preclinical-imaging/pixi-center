<!doctype html>
<!-- @dsCard group="Components" name="Study card" subtitle="Composite card — header, stats, meta" viewport="700x240" -->
<html><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { background: var(--pixi-paper); padding: 24px; }
  .study-card {
    background: #fff; border: 1px solid var(--border-subtle); border-radius: 8px;
    padding: 18px 20px; display: flex; flex-direction: column; gap: 14px;
  }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); font-family: var(--font-mono); }
  .title { font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin-top: 4px;}
  .badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 10px; font-size: 12px; font-weight: 600; border-radius: 999px; background: #FFF6D6; color: #8C6A00; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #FFC30F;}
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding-top: 12px; border-top: 1px solid var(--border-subtle); }
  .stat-l { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 4px;}
  .stat-v { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums;}
  .meta { display: flex; gap: 14px; font-size: 13px; color: var(--fg-3); align-items: center;}
  .mods { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
  .mod { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--pixi-navy); background: var(--pixi-navy-soft); border-radius: 4px; }
  .av { width: 22px; height: 22px; border-radius: 50%; background: #1E3C87; color: #fff; font-size: 10px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center;}
</style></head>
<body><div class="card">
  <div class="study-card">
    <div class="head">
      <div>
        <div class="eyebrow">PXI-2412-A · GLP biodistribution</div>
        <div class="title">GLP-1 receptor agonist · Q2 cohort</div>
      </div>
      <span class="badge"><span class="dot"></span>In progress</span>
    </div>
    <div class="stats">
      <div><div class="stat-l">Subjects</div><div class="stat-v">24</div></div>
      <div><div class="stat-l">Scans</div><div class="stat-v">96</div></div>
      <div><div class="stat-l">Modalities</div><div class="mods"><span class="mod">CT</span><span class="mod">PET</span><span class="mod">MR</span></div></div>
    </div>
    <div class="meta">
      <span class="av">EH</span><span>E. Hoshino · last edited 2 h ago</span>
    </div>
  </div>
</div></body></html>

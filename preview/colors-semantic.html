<!doctype html>
<!-- @dsCard group="Colors" name="Semantic colors" subtitle="Success / warning / info / danger pairs" viewport="700x220" -->
<html><head><meta charset="utf-8"><title>Semantic colors</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .item { border: 1px solid var(--border-subtle); border-radius: 8px; overflow: hidden; }
  .swatch-row { display: flex; height: 56px; }
  .solid { flex: 1; }
  .tint { width: 36%; }
  .info { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
  .lbl { font-size: 12px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; margin-top: 6px; width: fit-content; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="item">
      <div class="swatch-row"><div class="solid" style="background:#3CB44B"></div><div class="tint" style="background:#E6F4E8"></div></div>
      <div class="info"><div class="lbl">Success</div><div class="hex">#3CB44B</div>
        <div class="pill" style="background:#E6F4E8;color:#2F8E3B"><div class="dot" style="background:#3CB44B"></div>Complete</div>
      </div>
    </div>
    <div class="item">
      <div class="swatch-row"><div class="solid" style="background:#D9A300"></div><div class="tint" style="background:#FFF6D6"></div></div>
      <div class="info"><div class="lbl">Warning</div><div class="hex">#D9A300</div>
        <div class="pill" style="background:#FFF6D6;color:#8C6A00"><div class="dot" style="background:#FFC30F"></div>In progress</div>
      </div>
    </div>
    <div class="item">
      <div class="swatch-row"><div class="solid" style="background:#1E3C87"></div><div class="tint" style="background:#E8EDF7"></div></div>
      <div class="info"><div class="lbl">Info</div><div class="hex">#1E3C87</div>
        <div class="pill" style="background:#E8EDF7;color:#1E3C87"><div class="dot" style="background:#1E3C87"></div>Reviewing</div>
      </div>
    </div>
    <div class="item">
      <div class="swatch-row"><div class="solid" style="background:#C8362B"></div><div class="tint" style="background:#FCEBE9"></div></div>
      <div class="info"><div class="lbl">Danger</div><div class="hex">#C8362B</div>
        <div class="pill" style="background:#FCEBE9;color:#C8362B"><div class="dot" style="background:#C8362B"></div>Failed</div>
      </div>
    </div>
  </div>
</div></body></html>

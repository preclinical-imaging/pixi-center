  .row { display: flex; gap: 22px; align-items: flex-end; flex-wrap: wrap;}

  .item .nm { font-size: 11px; color: var(--fg-3);}
  svg { color: var(--fg-1); display:block;}
  .scale-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .size { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border-subtle); border-radius: 6px; }
  .size .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3);}
  .size .use { font-size: 11px; color: var(--fg-2); }

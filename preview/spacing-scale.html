<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4 px base — sp-1 through sp-24" viewport="700x320" -->
<html><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: 60px 50px 1fr; align-items: center; gap: 14px; height: 22px;}
  .name { font-size: 12px; font-weight: 600; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .bar { background: var(--pixi-navy); height: 14px; border-radius: 2px; }
</style></head>
<body><div class="card">
  <div class="row"><div class="name">sp-1</div><div class="px">4 px</div><div class="bar" style="width:4px"></div></div>
  <div class="row"><div class="name">sp-2</div><div class="px">8 px</div><div class="bar" style="width:8px"></div></div>
  <div class="row"><div class="name">sp-3</div><div class="px">12 px</div><div class="bar" style="width:12px"></div></div>
  <div class="row"><div class="name">sp-4</div><div class="px">16 px</div><div class="bar" style="width:16px"></div></div>
  <div class="row"><div class="name">sp-5</div><div class="px">20 px</div><div class="bar" style="width:20px"></div></div>
  <div class="row"><div class="name">sp-6</div><div class="px">24 px</div><div class="bar" style="width:24px"></div></div>
  <div class="row"><div class="name">sp-8</div><div class="px">32 px</div><div class="bar" style="width:32px"></div></div>
  <div class="row"><div class="name">sp-10</div><div class="px">40 px</div><div class="bar" style="width:40px"></div></div>
  <div class="row"><div class="name">sp-12</div><div class="px">48 px</div><div class="bar" style="width:48px"></div></div>
  <div class="row"><div class="name">sp-16</div><div class="px">64 px</div><div class="bar" style="width:64px"></div></div>
  <div class="row"><div class="name">sp-20</div><div class="px">80 px</div><div class="bar" style="width:80px"></div></div>
  <div class="row"><div class="name">sp-24</div><div class="px">96 px</div><div class="bar" style="width:96px"></div></div>
</div></body></html>

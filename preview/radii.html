<!doctype html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="Restrained — 3 / 6 / 8 / 12 / 16 / pill" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box {
    width: 76px; height: 76px;
    background: var(--pixi-cloud);
    border: 1px solid var(--border-default);
  }
  .nm { font-size: 12px; font-weight: 600; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style></head>
<body><div class="card">
  <div class="grid">
    <div class="item"><div class="box" style="border-radius:3px"></div><div class="nm">r-xs</div><div class="px">3 px</div></div>
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="nm">r-sm</div><div class="px">6 px · inputs</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="nm">r-md</div><div class="px">8 px · cards</div></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><div class="nm">r-lg</div><div class="px">12 px · modals</div></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><div class="nm">r-xl</div><div class="px">16 px</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="nm">r-pill</div><div class="px">pills only</div></div>
  </div>
</div></body></html>

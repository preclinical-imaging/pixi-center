<!doctype html>
<!-- @dsCard group="Colors" name="Neutrals scale" subtitle="9-step warm gray scale, white → ink" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Neutrals</title>
<link rel="stylesheet" href="_card.css">
<style>
  .scale { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
  .step { display: flex; flex-direction: column; gap: 6px; }
  .chip { height: 72px; border-radius: 6px; border: 1px solid var(--border-subtle); }
  .nm { font-size: 11px; font-weight: 600; color: var(--fg-1); }
  .hx { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
</style></head>
<body><div class="card">
  <div class="scale">
    <div class="step"><div class="chip" style="background:#FFFFFF"></div><div class="nm">white</div><div class="hx">#FFFFFF</div></div>
    <div class="step"><div class="chip" style="background:#F7F8F9"></div><div class="nm">paper</div><div class="hx">#F7F8F9</div></div>
    <div class="step"><div class="chip" style="background:#F1F2F4"></div><div class="nm">cloud</div><div class="hx">#F1F2F4</div></div>
    <div class="step"><div class="chip" style="background:#E4E6EA"></div><div class="nm">fog</div><div class="hx">#E4E6EA</div></div>
    <div class="step"><div class="chip" style="background:#C9CCD2"></div><div class="nm">mist</div><div class="hx">#C9CCD2</div></div>
    <div class="step"><div class="chip" style="background:#9DA1AA"></div><div class="nm">steel</div><div class="hx">#9DA1AA</div></div>
    <div class="step"><div class="chip" style="background:#6B6E76"></div><div class="nm">slate</div><div class="hx">#6B6E76</div></div>
    <div class="step"><div class="chip" style="background:#3D3F44"></div><div class="nm">graphite</div><div class="hx">#3D3F44</div></div>
    <div class="step"><div class="chip" style="background:#1A1B1E"></div><div class="nm">ink</div><div class="hx">#1A1B1E</div></div>
  </div>
</div></body></html>

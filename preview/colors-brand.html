<!doctype html>
<!-- @dsCard group="Colors" name="Brand colors" subtitle="Navy, green, yellow — sampled from logo" viewport="700x180" -->
<html><head><meta charset="utf-8"><title>Brand colors</title>
<link rel="stylesheet" href="_card.css">
<style>
  .swatch-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .swatch {
    display: flex; flex-direction: column; gap: 0;
    border: 1px solid var(--border-subtle); border-radius: 8px; overflow: hidden;
  }
  .chip { height: 80px; }
  .swatch .info { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; background: var(--pixi-white);}
  .swatch .name { font-size: 13px; font-weight: 600; color: var(--fg-1); }
  .swatch .hex { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
</style></head>
<body><div class="card">
  <div class="swatch-grid">
    <div class="swatch"><div class="chip" style="background:#1E3C87"></div><div class="info"><div class="name">Navy</div><div class="hex">#1E3C87 · pixi-navy</div></div></div>
    <div class="swatch"><div class="chip" style="background:#3CB44B"></div><div class="info"><div class="name">Green</div><div class="hex">#3CB44B · pixi-green</div></div></div>
    <div class="swatch"><div class="chip" style="background:#FFC30F"></div><div class="info"><div class="name">Yellow</div><div class="hex">#FFC30F · pixi-yellow</div></div></div>
  </div>
</div></body></html>

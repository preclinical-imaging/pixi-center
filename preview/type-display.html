<!doctype html>
<!-- @dsCard group="Type" name="Display type" subtitle="Inter Tight — display, h1, h2, h3" viewport="700x320" -->
<html><head><meta charset="utf-8"><title>Display type</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; align-items: baseline; gap: 24px; }
  .meta { width: 130px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px;}
  .meta .nm { font-size: 12px; font-weight: 600; color: var(--fg-1); }
  .meta .sub { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); }
  .specimen { font-family: var(--font-display); color: var(--fg-1); letter-spacing: -0.02em; line-height: 1.05; font-weight: 600;}
</style></head>
<body><div class="card">
  <div class="row"><div class="meta"><div class="nm">Display</div><div class="sub">64 / 600 / Inter Tight</div></div><div class="specimen" style="font-size:54px">Preclinical</div></div>
  <div class="row"><div class="meta"><div class="nm">H1</div><div class="sub">48 / 600</div></div><div class="specimen" style="font-size:42px">Imaging Workbench</div></div>
  <div class="row"><div class="meta"><div class="nm">H2</div><div class="sub">38 / 600</div></div><div class="specimen" style="font-size:32px">Cohort overview</div></div>
  <div class="row"><div class="meta"><div class="nm">H3</div><div class="sub">30 / 600</div></div><div class="specimen" style="font-size:26px">Subjects (n = 24)</div></div>
</div></body></html>

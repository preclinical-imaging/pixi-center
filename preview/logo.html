<!doctype html>
<!-- @dsCard group="Brand" name="Logo" subtitle="Primary mark with brand colors" viewport="700x200" -->
<html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 32px 24px; display: flex; align-items: center; justify-content: center; gap: 32px; }
  .lockup img { width: 220px; height: auto; display: block; }
  .swatches { display: flex; gap: 8px; margin-top: 16px; }
  .sw { width: 28px; height: 28px; border-radius: 4px; }
  .meta { display: flex; flex-direction: column; gap: 6px; }
  .meta .name { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .meta .desc { font-size: 13px; color: var(--fg-3); max-width: 260px; line-height: 1.5; }
</style></head>
<body><div class="card">
  <div class="lockup"><img src="../assets/pixi-center-logo.png" alt="PIXI Center"></div>
  <div class="meta">
    <div class="name">PIXI Center</div>
    <div class="desc">Primary brand mark. Open "C" enclosing a green crescent and a yellow half-disc — the wordmark always sits to the right.</div>
    <div class="swatches">
      <div class="sw" style="background:#1E3C87"></div>
      <div class="sw" style="background:#3CB44B"></div>
      <div class="sw" style="background:#FFC30F"></div>
    </div>
  </div>
</div></body></html>
